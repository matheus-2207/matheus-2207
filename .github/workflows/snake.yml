name: Generate contribution snake

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate light and dark contribution snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Preserve generated files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/snake-assets"
          cp dist/github-snake.svg "$RUNNER_TEMP/snake-assets/"
          cp dist/github-snake-dark.svg "$RUNNER_TEMP/snake-assets/"

      - name: Publish generated files to the output branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch origin output
            git checkout -B output FETCH_HEAD
          else
            git checkout --orphan output
          fi

          git rm -rf --ignore-unmatch .
          cp "$RUNNER_TEMP/snake-assets/"*.svg .
          git add github-snake.svg github-snake-dark.svg

          if git diff --cached --quiet; then
            echo "Snake assets are already up to date."
            exit 0
          fi

          git commit -m "Update contribution snake"
          git push origin output
